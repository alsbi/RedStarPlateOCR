# Augmentation config — moderate strength for license plate OCR
# Strength is scaled by aug_strength (0.0→1.0) during ramp-up

# Pixel-level transforms
brightness_contrast:
  enabled: true
  brightness_limit: 0.15
  contrast_limit: 0.15
  p: 0.4

motion_blur:
  enabled: true
  blur_limit: 3
  p: 0.15

gauss_noise:
  enabled: true
  p: 0.2

jpeg_compression:
  enabled: true
  quality_range: [85, 100]
  p: 0.2

coarse_dropout:
  enabled: true
  max_holes: 4
  max_height: 6
  max_width: 6
  p: 0.15

# Geometric transforms
rotation:
  enabled: true
  limit: 3
  p: 0.3

perspective:
  enabled: true
  scale: 0.05
  p: 0.25

affine:
  enabled: true
  shear_x: [-5, 5]
  translate_percent_x: [-0.05, 0.05]
  p: 0.25
