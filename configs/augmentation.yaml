# Augmentation config — moderate strength for license plate OCR
# Strength is scaled by aug_strength (0.0→1.0) during ramp-up

# Pixel-level transforms
brightness_contrast:
  enabled: true
  brightness_limit: 0.15
  contrast_limit: 0.15
  p: 0.5

motion_blur:
  enabled: true
  blur_limit: 3
  p: 0.15

gauss_noise:
  enabled: true
  p: 0.2

jpeg_compression:
  enabled: true
  quality_range: [85, 100]
  p: 0.3

coarse_dropout:
  enabled: true
  max_holes: 4
  max_height: 6
  max_width: 6
  p: 0.15

infrared_glow:
  enabled: true
  # IR colour shift intensity (0.0 = no tint, 1.0 = strong)
  tint_strength: 0.3
  # Contrast amplification (1.0 = no boost)
  contrast_boost: 1.4
  # Gaussian sigma for bloom/glow halo (0 = disabled)
  glow_sigma: 3
  p: 0.3

# Geometric transforms
rotation:
  enabled: true
  limit: 4
  p: 0.3

perspective:
  enabled: true
  scale: 0.06
  p: 0.25

affine:
  enabled: true
  shear_x: [-5, 5]
  translate_percent_x: [-0.05, 0.05]
  p: 0.25

# Warmup adaptive augmentation schedule
warmup:
  enable_warmup: true            # Master switch - when false, training works as before
  initial_severity: 1.0          # Starting severe_aug severity (0-1)
  threshold_disable_severe: 0.15  # Word accuracy threshold to fully disable severe
  severe_step: 0.01              # Step size for decreasing severe_severity
  patience_severe: 10            # Epochs without improvement before forced severe decrease
  severe_threshold_std_start: 0.3  # severe level where std starts growing
  severe_midpoint: 0.15           # Intermediate point for std transition curve
  early_stop_patience: 15        # Early stopping patience after severe is disabled
